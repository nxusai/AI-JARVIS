<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#05070d}
*{box-sizing:border-box}
#st{position:absolute;inset:0;font-family:Inter,sans-serif;color:#fff;overflow:hidden}
.abs{position:absolute}
.g{background:linear-gradient(100deg,#00e5ff,#0a6cff 50%,#a01cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel{position:absolute;left:90px;width:900px;border-radius:36px;background:rgba(12,17,32,.94);border:2px solid rgba(255,255,255,.10);box-shadow:0 40px 120px rgba(0,0,0,.65),0 0 0 1px rgba(0,229,255,.08);overflow:hidden}
.barra{height:70px;display:flex;align-items:center;gap:14px;padding:0 30px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.07);font:600 26px Inter;color:#9fb0d0}
.dot{width:16px;height:16px;border-radius:50%}
.burb{max-width:78%;padding:22px 28px;border-radius:30px;font-size:34px;line-height:1.3;margin:16px 0}
.cli{background:#1f2a44;border-bottom-left-radius:8px}
.ia{background:linear-gradient(135deg,#0a6cff,#7b2bff);margin-left:auto;border-bottom-right-radius:8px}
.sticker{position:absolute;padding:18px 34px;border-radius:18px;font:800 52px Sora;letter-spacing:.02em;color:#04121c;background:linear-gradient(100deg,#00e5ff,#36a2ff);box-shadow:0 14px 0 rgba(0,0,0,.35),0 20px 60px rgba(0,229,255,.35);white-space:nowrap}
.sub{position:absolute;left:0;right:0;top:1395px;text-align:center}
.pill{display:inline-block;padding:16px 34px;border-radius:22px;background:rgba(5,8,16,.72);font:800 64px Sora;letter-spacing:.02em;text-transform:uppercase}
.check{display:flex;align-items:center;gap:22px;font:600 36px Inter;margin:22px 0}
.box{width:46px;height:46px;border-radius:12px;border:3px solid #33415f;display:grid;place-items:center;font:800 32px Inter;color:#04121c}
</style></head>
<body><div id="st"></div>
<script src="logo.js"></script>
<script>
const W = window.PALABRAS
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const sal = (t, a, d) => cl((t - a) / d)
const ease = (k) => 1 - Math.pow(1 - k, 3)
const back = (k) => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2) }
const vis = (t, a, b, f = .25) => cl(Math.min((t - a) / f, (b - t) / f))
const entra = (t, a, d = .45) => { const k = sal(t, a, d); return `opacity:${cl(k * 3)};transform:translateY(${(1 - ease(k)) * 80}px) scale(${.92 + .08 * back(k)})` }
const golpe = (t, a, rot = -4) => { const k = sal(t, a, .32); return `opacity:${cl(k * 4)};transform:rotate(${rot}deg) scale(${k < 1 ? 1.6 - .6 * back(k) : 1})` }
const tipea = (txt, t, a, cps = 32) => txt.slice(0, Math.max(0, Math.floor((t - a) * cps)))

// Escenas (segundos del audio)
const NOCHE_FIN = 4.2, IA = 4.2, CHAT = 6.1, LLAMA = 9.4, CITA = 12.5, CRM = 16.1, MANANA = 20.2, CIERRE = 23.95, LOOP = 29.15

function cuarto(t, dia) {
  // Fondo: pared, ventana con luna (o sol), escritorio.
  const cielo = dia ? 'linear-gradient(#ffcf8a,#ff9d5c 60%,#f07a4a)' : 'linear-gradient(#0b1430,#101a3d 70%,#1a2350)'
  const pared = dia ? 'linear-gradient(#3a2f3b,#2a2230)' : 'linear-gradient(#0a0e1b,#0d1222)'
  const astro = dia
    ? `<div class="abs" style="left:250px;top:${60 - 30 * sal(t, MANANA, 2)}px;width:120px;height:120px;border-radius:50%;background:#fff3c4;box-shadow:0 0 120px 40px rgba(255,220,140,.55)"></div>`
    : `<div class="abs" style="left:250px;top:60px;width:110px;height:110px;border-radius:50%;background:#e9eefc;box-shadow:0 0 80px 18px rgba(170,190,255,.35)"></div><div class="abs" style="left:282px;top:44px;width:110px;height:110px;border-radius:50%;background:#101a3d"></div>`
  const estrellas = dia ? '' : Array.from({ length: 14 }, (_, i) => `<div class="abs" style="left:${20 + ((i * 97) % 400)}px;top:${20 + ((i * 53) % 380)}px;width:6px;height:6px;background:#fff;opacity:${.3 + .7 * Math.abs(Math.sin(t * 2 + i))}"></div>`).join('')
  return `
  <div class="abs" style="inset:0;background:${pared}"></div>
  <div class="abs" style="left:440px;top:170px;width:480px;height:440px;border:18px solid ${dia ? '#5a4652' : '#1b2238'};background:${cielo};overflow:hidden">${estrellas}${astro}
    <div class="abs" style="left:0;right:0;top:204px;height:14px;background:${dia ? '#5a4652' : '#1b2238'}"></div>
    <div class="abs" style="top:0;bottom:0;left:214px;width:14px;background:${dia ? '#5a4652' : '#1b2238'}"></div></div>
  <div class="abs" style="left:0;right:0;top:1180px;height:30px;background:${dia ? '#6b4a3a' : '#1c1a24'}"></div>
  <div class="abs" style="left:0;right:0;top:1210px;bottom:0;background:${dia ? 'linear-gradient(#4a3329,#2d1f19)' : 'linear-gradient(#121019,#08070c)'}"></div>`
}

function telefono(t, x, y, escala, contenido, brillo) {
  return `<div class="abs" style="left:${x}px;top:${y}px;width:260px;height:500px;transform:scale(${escala});transform-origin:bottom left;border-radius:44px;background:#05070d;border:8px solid #262c3d;box-shadow:0 0 ${brillo * 140}px ${brillo * 30}px rgba(0,229,255,${.35 * brillo});overflow:hidden">
    <div class="abs" style="inset:0;background:linear-gradient(160deg,#122046,#0a0f22);opacity:${.25 + .75 * brillo}"></div>${contenido}</div>`
}

// Tu muñeco en capas: cuerpo + dos brazos que giran en el hombro; parpadea solo.
function muneco(t, { x, y, h, ojos = 'abiertos', bi = 0, bd = 0, filtro = '' }) {
  const parpadeo = ojos === 'abiertos' && ((t + 0.7) % 3.1 < 0.13 || (t + 2.2) % 7.3 < 0.11)
  const cuerpo = ojos === 'dormido' || parpadeo ? 'pjd_cuerpo.png' : ojos === 'feliz' ? 'pjf_cuerpo.png' : 'pj_cuerpo.png'
  const w = h * 817 / 1888
  const img = (src, extra = '') => `<img src="${src}" class="abs" style="left:0;top:0;width:${w}px;height:${h}px;${extra}">`
  return `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${filtro ? `filter:${filtro}` : ''}">
    ${img('brazo_i.png', `transform-origin:22% 47.4%;transform:rotate(${bi}deg)`)}
    ${img('brazo_d.png', `transform-origin:77.1% 47.4%;transform:rotate(${bd}deg)`)}
    ${img(cuerpo)}</div>`
}

function personaje(t, src, x, y, h, extra = '') {
  return `<img src="${src}" class="abs" style="left:${x}px;top:${y}px;height:${h}px;image-rendering:auto;${extra}">`
}

function zzz(t) {
  return [0, 1, 2].map((i) => {
    const k = ((t * .55 + i / 3) % 1)
    return `<div class="abs" style="left:${560 + k * 120}px;top:${520 - k * 260}px;font:800 ${46 + i * 14}px Sora;color:#9fd8ff;opacity:${Math.sin(k * Math.PI)}">Z</div>`
  }).join('')
}

function escenaNoche(t, t0, reloj) {
  // Él dormido; el celular se enciende con el mensaje.
  const llega = sal(t, t0 + .5, .35)
  const vib = llega > 0 && t < t0 + 1.6 ? Math.sin(t * 80) * 6 : 0
  const pant = `
    <div class="abs" style="left:0;right:0;top:70px;text-align:center;font:700 92px Sora;letter-spacing:.02em">${reloj}</div>
    <div class="abs" style="left:0;right:0;top:178px;text-align:center;font:500 22px Inter;color:#9fb0d0">AM</div>
    <div class="abs" style="left:18px;right:18px;top:240px;padding:16px 18px;border-radius:22px;background:rgba(255,255,255,.12);${entra(t, t0 + .5, .35)}">
      <div style="font:700 20px Inter;color:#7fe9ff">💬 Mensaje nuevo</div><div style="font:500 20px Inter;margin-top:6px">Hola, ¿me pasan precios?</div></div>`
  return cuarto(t, false) +
    muneco(t, { x: 150, y: 470 + Math.sin(t * 2.2) * 6, h: 1180, ojos: 'dormido', bi: 2 + Math.sin(t * 2.2) * 1.5, bd: -2 - Math.sin(t * 2.2) * 1.5, filtro: 'brightness(.62) saturate(.8)' }) + zzz(t) +
    telefono(t, 700 + vib, 690, 1, pant, llega)
}

function escenaManana(t) {
  // Despierta, ve el celular y festeja.
  const salta = t > MANANA + 2.1 ? Math.abs(Math.sin((t - MANANA - 2.1) * 6)) * 70 : 0
  const k = t - MANANA
  const ojos = k < .5 ? 'dormido' : k < 2.1 ? 'abiertos' : 'feliz'
  // Se estira, señala el celular y festeja con los dos brazos arriba.
  let bi = 0, bd = 0
  if (k < .5) { bi = 2; bd = -2 }
  else if (k < 1.1) { const e = ease(sal(k, .5, .35)); bi = 160 * e; bd = -160 * e }
  else if (k < 2.1) { const e = ease(sal(k, 1.1, .3)); bi = 160 * (1 - e) + 4 * Math.sin(t * 3); bd = -160 + 105 * e + Math.sin(t * 9) * 6 }
  else { bi = 150 + Math.sin(t * 12) * 18; bd = -150 - Math.sin(t * 12 + 1) * 18 }
  const pant = `
    <div class="abs" style="left:0;right:0;top:70px;text-align:center;font:700 92px Sora">8:02</div>
    <div class="abs" style="left:18px;right:18px;top:220px;padding:16px 18px;border-radius:22px;background:rgba(255,255,255,.14);${entra(t, MANANA + 1.1, .35)}">
      <div style="font:700 20px Inter;color:#7fe9ff">📅 Cita agendada</div><div style="font:500 20px Inter;margin-top:6px">Hoy 11:00 · Cliente nuevo</div></div>`
  const confeti = t > MANANA + 2.1 ? Array.from({ length: 40 }, (_, i) => {
    const k = (t - MANANA - 2.1) * (0.6 + (i % 5) * .12)
    return `<div class="abs" style="left:${80 + ((i * 131) % 920)}px;top:${-40 + k * 700 + ((i * 37) % 200)}px;width:18px;height:28px;background:${['#00e5ff', '#0a6cff', '#a01cff', '#ffd23f'][i % 4]};transform:rotate(${k * 300 + i * 20}deg)"></div>`
  }).join('') : ''
  return cuarto(t, true) +
    muneco(t, { x: 150, y: 470 - salta, h: 1180, ojos, bi, bd }) +
    telefono(t, 700, 690, 1, pant, 1) + confeti
}

function app(t) {
  // La app de NXUS: chat → llamada → preguntas y cita → ficha en el CRM.
  let h = ''
  const barra = (titulo, estado) => `<div class="barra"><div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div><span style="margin-left:14px;color:#dbe6ff">${titulo}</span><span style="margin-left:auto;font-size:22px;color:#00e5ff">${estado}</span></div>`
  if (t >= IA && t < CHAT) {
    // El núcleo de la IA despierta.
    const k = sal(t, IA, .5)
    h += `<div class="abs" style="left:340px;top:520px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,#7ff3ff 0%,#0a6cff 45%,#a01cff 75%,transparent 76%);opacity:${k};transform:scale(${.6 + .4 * back(k)});box-shadow:0 0 200px 40px rgba(0,229,255,.45)"></div>
      <div class="abs" style="left:0;right:0;top:960px;text-align:center;font:800 64px Sora;${entra(t, IA + .3)}">Mi <span class="g">IA</span> no duerme</div>`
  }
  if (t >= CHAT && t < LLAMA) {
    const r1 = 'Hola, ¿me pasan precios para mi restaurante?'
    const r2 = '¡Hola! Claro que sí. ¿Cuántas sucursales tienes y qué necesitas?'
    h += `<div class="panel" style="top:470px;${entra(t, CHAT)}">${barra('NXUS · WhatsApp', '● en línea')}
      <div style="padding:30px">
        <div class="burb cli">${r1}</div>
        ${t > CHAT + .9 ? `<div class="burb ia">${tipea(r2, t, CHAT + 1.0, 30)}${t < CHAT + 3.3 ? '<span style="opacity:.7">▍</span>' : ''}</div>` : ''}
        ${t > CHAT + .9 ? `<div style="text-align:right;font:500 22px Inter;color:#7f8db0;${entra(t, CHAT + 1)}">Contestó al instante · 3:12 AM</div>` : ''}
      </div></div>`
  }
  if (t >= LLAMA && t < CITA) {
    const barras = Array.from({ length: 34 }, (_, i) => `<div style="width:12px;border-radius:6px;background:linear-gradient(#00e5ff,#a01cff);height:${30 + Math.abs(Math.sin(t * 9 + i * .7)) * 120 * (t > LLAMA + .8 ? 1 : .15)}px"></div>`).join('')
    h += `<div class="panel" style="top:470px;${entra(t, LLAMA)}">${barra('NXUS · Llamada', t > LLAMA + .8 ? '● en llamada' : 'marcando…')}
      <div style="display:flex;flex-direction:column;align-items:center;padding:70px 0 60px">
        <div style="width:200px;height:200px;border-radius:50%;background:linear-gradient(135deg,#0a6cff,#a01cff);display:grid;place-items:center;font:800 70px Sora">IA</div>
        <div style="font:700 44px Sora;margin-top:34px">Llamando a cliente nuevo</div>
        <div style="font:500 28px Inter;color:#9fb0d0;margin-top:10px">${t > LLAMA + .8 ? '00:' + String(Math.floor((t - LLAMA - .8) * 4) % 60).padStart(2, '0') : 'conectando…'}</div>
        <div style="display:flex;align-items:center;gap:8px;height:200px;margin-top:40px">${barras}</div>
      </div></div>`
  }
  if (t >= CITA && t < CRM) {
    const preguntas = ['¿Qué tipo de negocio tienes?', '¿Cuántas sucursales?', '¿Qué quieres automatizar?']
    const marca = (i) => t > CITA + .4 + i * .7
    const cal = t > CITA + 2.1
    h += `<div class="panel" style="top:440px;${entra(t, CITA)}">${barra('NXUS · Calificación', cal ? '✓ cita agendada' : 'preguntando…')}
      <div style="padding:34px 44px">
        ${preguntas.map((p, i) => `<div class="check"><div class="box" style="${marca(i) ? 'background:#00e5ff;border-color:#00e5ff' : ''}">${marca(i) ? '✓' : ''}</div>${p}</div>`).join('')}
        <div style="margin-top:34px;border-radius:24px;border:2px solid rgba(255,255,255,.08);overflow:hidden;${cal ? entra(t, CITA + 2.1) : 'opacity:0'}">
          <div style="display:grid;grid-template-columns:repeat(5,1fr);font:600 22px Inter;color:#7f8db0;text-align:center;padding:14px 0;background:rgba(255,255,255,.04)"><div>LUN</div><div>MAR</div><div>MIÉ</div><div>JUE</div><div>VIE</div></div>
          <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px;height:200px">
            ${[0, 1, 2, 3, 4].map((d) => `<div style="border-radius:14px;background:${d === 1 ? 'linear-gradient(135deg,#0a6cff,#a01cff)' : 'rgba(255,255,255,.04)'};${d === 1 ? `transform:scale(${.6 + .4 * back(sal(t, CITA + 2.5, .4))})` : ''};display:grid;place-items:center;font:700 24px Inter">${d === 1 ? 'Cita<br>11:00' : ''}</div>`).join('')}
          </div></div>
      </div></div>`
  }
  if (t >= CRM && t < MANANA) {
    const fila = (k, v, i) => `<div style="display:flex;justify-content:space-between;padding:24px 0;border-bottom:1px solid rgba(255,255,255,.07);font:500 34px Inter;${entra(t, CRM + .4 + i * .9)}"><span style="color:#7f8db0">${k}</span><span style="font-weight:700">${v}</span></div>`
    h += `<div class="panel" style="top:470px;${entra(t, CRM)}">${barra('NXUS · CRM', 'guardado')}
      <div style="padding:30px 44px">
        <div style="display:flex;align-items:center;gap:24px;margin-bottom:20px"><div style="width:110px;height:110px;border-radius:50%;background:#1f2a44;display:grid;place-items:center;font:800 44px Sora">CN</div><div><div style="font:700 42px Sora">Cliente nuevo</div><div style="font:500 26px Inter;color:#00e5ff">Lead caliente 🔥</div></div></div>
        ${fila('Quién es', 'Restaurante · 3 sucursales', 0)}${fila('Qué quiere', 'Contestar 24/7', 1)}${fila('Cuándo hablamos', 'Martes 11:00', 2)}
      </div></div>`
  }
  return h
}

function cierre(t) {
  const k = sal(t, CIERRE, .6)
  return `<div class="abs" style="inset:0;background:radial-gradient(circle at 50% 40%,#0f1c44,#05070d 70%)"></div>
    <div class="abs" style="left:290px;top:${330 - 30 * ease(k)}px;width:500px;height:330px;opacity:${k}">${LOGO('lg')}</div>
    <div class="abs" style="left:0;right:0;top:720px;text-align:center;font:800 72px Sora;${entra(t, CIERRE + .2)}">Eso hacemos en <span class="g">NXUS AI</span></div>
    <div class="abs" style="left:150px;right:150px;top:930px;padding:44px;border-radius:36px;background:rgba(12,17,32,.9);border:2px solid rgba(0,229,255,.35);text-align:center;box-shadow:0 0 120px rgba(0,229,255,.18);${entra(t, CIERRE + 1.6)}">
      <div style="font:800 64px Sora" class="g">DIAGNÓSTICO GRATIS</div>
      <div style="font:600 40px Inter;margin-top:14px">30 minutos</div>
      <div style="font:500 28px Inter;color:#9fb0d0;margin-top:14px">Cupos limitados este mes</div></div>` +
    muneco(t, { x: 60, y: 1460 + (1 - ease(sal(t, CIERRE + .3, .5))) * 500, h: 470, ojos: 'abiertos', bi: 4 + Math.sin(t * 2) * 3, bd: t < CIERRE + 1.6 ? -125 + Math.sin(t * 14) * 22 : -55 + Math.sin(t * 3) * 4 })
}

const STICKERS = [
  { txt: '24/7', a: 4.5, b: 6.1, x: 640, y: 420, r: -6 },
  { txt: 'AL MOMENTO', a: 10.9, b: 12.5, x: 470, y: 370, r: 4 },
  { txt: 'SIN CONTRATAR', a: 16.5, b: 20.1, x: 360, y: 340, r: -5 },
]

// Subtítulos: 1 a 3 palabras, la que suena resaltada; palabras clave en cian.
const CLAVE = /dormido|^ia$|segundos|llam|cita|guardado|calendario|nxus|diagn|gratis|minutos|30|3|serio/i
const GRUPOS = []
{ let g = [] ; for (const w of W) { g.push(w); if (g.length === 3 || /[.,?!]$/.test(w[2])) { GRUPOS.push(g); g = [] } } if (g.length) GRUPOS.push(g) }
function subtitulos(t) {
  const g = GRUPOS.find((x, i) => t >= x[0][0] - .05 && t < (GRUPOS[i + 1]?.[0][0] ?? x.at(-1)[1] + .4) - .05)
  if (!g || t > LOOP) return ''
  return `<div class="sub"><span class="pill">${g.map((w) => {
    const txt = w[2].replace(/^Nexus$/i, 'NXUS').replace(/[¿?.,]/g, '')
    const on = t >= w[0] - .03
    return `<span style="display:inline-block;margin:0 10px;${on ? '' : 'opacity:.35;'}${CLAVE.test(txt) ? 'color:#00e5ff' : 'color:#fff'}">${txt}</span>`
  }).join('')}</span></div>`
}

window.render = (t) => {
  let h = ''
  if (t < NOCHE_FIN) h = escenaNoche(t, 0, '3:12')
  else if (t < MANANA) h = `<div class="abs" style="inset:0;background:radial-gradient(circle at 50% 35%,#0d1838,#05070d 70%)"></div>` + app(t) + muneco(t, { x: 70, y: 1500 + Math.sin(t * 2.2) * 4, h: 420, ojos: 'dormido', filtro: 'brightness(.7)' }) + [0, 1, 2].map((i) => { const k = ((t * .55 + i / 3) % 1); return `<div class="abs" style="left:${215 + k * 70}px;top:${1540 - k * 150}px;font:800 ${30 + i * 10}px Sora;color:#9fd8ff;opacity:${Math.sin(k * Math.PI)}">Z</div>` }).join('') + `<div class="abs" style="left:300px;top:1700px;font:600 30px Inter;color:#7f8db0">mientras tú duermes…</div>`
  else if (t < CIERRE) h = escenaManana(t)
  else if (t < LOOP) h = cierre(t)
  else h = escenaNoche(t, LOOP - .3, '3:11')
  for (const s of STICKERS) if (t >= s.a && t < s.b) h += `<div class="sticker" style="left:${s.x}px;top:${s.y}px;${golpe(t, s.a, s.r)}">${s.txt}</div>`
  // Destello en cada cambio de escena.
  for (const c of [IA, CHAT, LLAMA, CITA, CRM, MANANA, CIERRE, LOOP]) { const k = 1 - sal(t, c, .18); if (t >= c && k > 0) h += `<div class="abs" style="inset:0;background:#bff6ff;opacity:${k * .35}"></div>` }
  h += subtitulos(t)
  document.getElementById('st').innerHTML = h
}
</script></body></html>
