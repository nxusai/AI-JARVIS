<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@500;600;700;800&family=Special+Elite&display=swap">
<style>
html,body{margin:0;background:transparent}
*{box-sizing:border-box}
.lienzo{position:relative;width:1080px;overflow:hidden;font-family:Inter;color:#fff;background:#120c33}
.lienzo img.fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,6,30,.15) 0%,rgba(10,6,30,0) 35%,rgba(10,6,30,.55) 62%,rgba(10,6,30,.96) 100%)}
.papel{position:absolute;left:60px;right:60px;padding:34px 40px 38px;background:#f4efe4;color:#14122b;font-family:'Special Elite',monospace;font-size:80px;line-height:1.08;text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.45);transform:rotate(-1.5deg);clip-path:polygon(0 4%,3% 0,22% 3%,41% 0,63% 2%,84% 0,100% 3%,99% 52%,100% 97%,80% 100%,58% 97%,37% 100%,15% 97%,0 100%,1% 50%)}
.papel b{color:#6d28d9}
.cinta{position:absolute;width:190px;height:54px;background:rgba(236,228,200,.85)}
.pie{position:absolute;left:70px;right:70px}
.lema{font-family:Sora;font-weight:800;font-size:58px;line-height:1.12;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.chk{display:flex;align-items:center;gap:18px;font-weight:700;font-size:42px;margin-top:16px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.chk i{width:48px;height:48px;border-radius:50%;background:#22c55e;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:30px}
.fila{display:flex;align-items:center;justify-content:space-between;margin-top:34px}
.marca{display:flex;align-items:center;gap:18px;font-family:Sora;font-weight:800;font-size:44px;letter-spacing:3px}
.btn{padding:24px 44px;border-radius:999px;background:linear-gradient(100deg,#00e5ff,#0a6cff 50%,#a01cff);font-family:Sora;font-weight:800;font-size:44px;box-shadow:0 16px 44px rgba(120,60,255,.5)}
</style></head><body><div id="st"></div>
<script>
const LOGO = (id) => `<svg viewBox="160 310 950 620" width="100%" height="100%"><defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="177" y1="0" x2="1090" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset=".5" stop-color="#0a6cff"/><stop offset="1" stop-color="#a01cff"/></linearGradient></defs><g fill="url(#${id})"><polygon points="177,326 305,326 645,717 558,816 294,497 294,916 177,916"/><polygon points="496,394 663,394 1080,916 928,916"/><polygon points="943,394 1090,394 642,916 484,916"/></g></svg>`
window.pintar = (c, alto) => {
  const t = alto > 1500 ? 300 : 70        // en historias, dejar libre la franja de arriba
  const pieTop = alto > 1500 ? 830 : 800
  document.getElementById('st').innerHTML = `<div class="lienzo" style="height:${alto}px">
    <img class="fondo" src="${c.fondo}"><div class="velo"></div>
    <div class="papel" style="top:${t}px">${c.pregunta}</div>
    <div class="cinta" style="left:110px;top:${t - 24}px;transform:rotate(-8deg)"></div>
    <div class="cinta" style="right:110px;top:${t - 20}px;transform:rotate(7deg)"></div>
    <div class="pie" style="top:${pieTop}px">
      <div class="lema">${c.lema}</div>
      ${c.puntos.map((p) => `<div class="chk"><i>✓</i>${p}</div>`).join('')}
      <div class="fila"><div class="marca"><span style="width:96px;height:62px;display:inline-block">${LOGO('l' + alto)}</span>NXUS AI</div><div class="btn">Escríbanos →</div></div>
    </div></div>`
}
</script></body></html>
