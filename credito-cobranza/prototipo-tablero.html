.veil { position: absolute; inset: 0; background:
  linear-gradient(180deg, rgba(8,11,20,.28) 0%, rgba(8,11,20,.14) 40%, rgba(8,11,20,.44) 100%),

/* ---- Estructura ---- */
.app { height: 100%; display: grid; grid-template-columns: 248px 1fr; }
.side { display: flex; flex-direction: column; gap: 6px; padding: 18px 14px;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--stroke);
  background: linear-gradient(180deg, rgba(14,19,34,.52), rgba(10,14,26,.5)); backdrop-filter: blur(28px) saturate(1.3); -webkit-backdrop-filter: blur(28px) saturate(1.3); }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
.logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--teal), var(--blue)); box-shadow: 0 6px 18px rgba(40,224,200,.35); }
.logo svg { width: 19px; height: 19px; }
.brand b { font-family: var(--font-d); font-size: 15px; letter-spacing: .2px; }
.brand span { display: block; font-size: 11px; color: var(--ink-3); }
.nav { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
.nav-h { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); padding: 12px 10px 4px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 11px; color: var(--ink-2); text-decoration: none; cursor: pointer; font-weight: 500; border: 1px solid transparent; }
.nav a:hover { background: var(--glass); color: var(--ink); }
.nav a.on { background: linear-gradient(135deg, rgba(40,224,200,.18), rgba(91,140,255,.16)); color: var(--ink); border-color: var(--stroke-2); }
.nav a .ic { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; }
.nav a .tag { margin-left: auto; font-size: 10px; background: var(--rose); color: #2a0712; border-radius: 999px; padding: 1px 7px; font-weight: 600; }
.powered { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 11px;
  background: var(--glass); border: 1px solid var(--stroke); color: var(--ink-3); text-decoration: none; font-size: 11.5px; transition: border-color .15s, color .15s; }
.powered:hover { border-color: var(--stroke-2); color: var(--ink-2); }
.powered img { opacity: .9; flex: none; }
.powered b { color: var(--ink); font-weight: 600; }

.main { min-width: 0; min-height: 0; overflow-y: auto; }
.demo { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 7px max(16px, env(safe-area-inset-right,0px)) 7px max(16px, env(safe-area-inset-left,0px));
  background: linear-gradient(90deg, rgba(255,194,75,.14), rgba(255,122,156,.12)); border-bottom: 1px solid var(--stroke); font-size: 12px; color: var(--ink-2); backdrop-filter: blur(10px); }
.demo b { color: var(--amber); }
.wrap { padding: 20px; padding-left: max(20px, env(safe-area-inset-left,0px)); padding-right: max(20px, env(safe-area-inset-right,0px)); display: grid; gap: 18px; }

.top { display: flex; align-items: flex-end; gap: 16px 20px; flex-wrap: wrap; }
.hello { flex: 1 1 260px; min-width: 0; }

            <select class="glass" id="scope"><option>Toda la empresa</option><option>Región Norte</option><option>Gerencia Ecatepec</option><option>Ruta Ecatepec Mañana</option></select>
          </div>
          <div class="seg" id="period"><button data-p="sem" class="on">Semana</button><button data-p="mes">Mes</button><button data-p="anio">Año</button></div>
          <button class="btn" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg> Exportar</button>
        </div>
      </div>
      <section class="kpis" id="kpis"></section>
      <div class="grid2">
        <div class="card panel">
          <div class="ph"><div><h3>Cartera por estado</h3><div class="sub" id="cartTotalSub">Total en dinero</div></div><span class="pill" id="cartDelta">0.0%</span></div>
          <div class="donut-wrap"><div class="chart-box" style="height:180px"><canvas id="donut"></canvas></div><div class="legend" id="donutLegend"></div></div>
          <div class="note"><span>Mostrado en pesos, no en número de clientes. Cambia el ámbito para desglosar por nivel.</span></div>
        </div>
        <div class="card panel"><div class="ph"><div><h3>Cobranza del día</h3><div class="sub">Cobrado vs meta por ruta</div></div></div><div class="list" id="cobranza"></div></div>
      </div>
      <div class="grid3">
        <div class="card panel" style="grid-column: span 2;"><div class="ph"><div><h3>Recaudo vs colocación</h3><div class="sub" id="trendSub">Sin movimientos</div></div></div><div class="chart-box" style="height:230px"><canvas id="trend"></canvas></div></div>
        <div class="card panel"><div class="ph"><div><h3>Cajas por gerente</h3><div class="sub">Cierre automático</div></div></div><div class="list" id="cajas"></div>
          <div class="auto"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> Traslado automático a las 18:00 · con bitácora</div></div>
      </div></div>`; },
    init(){
      const h=new Date().getHours(); $("greet").textContent = h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches";
      $("kpis").innerHTML = kpis.map((k,x)=>`<div class="card kpi"><div class="row1"><div class="ico" style="background:linear-gradient(135deg,${k.grad[0]},${k.grad[1]})"><svg viewBox="0 0 24 24">${k.ico}</svg></div><span class="chg flat">0.0%</span></div><div><div class="lab">${k.lab}</div><div class="val">$0</div></div><canvas class="spark" id="sp${x}" height="46"></canvas></div>`).join("");
      kpis.forEach((k,x)=>{ const el=$("sp"+x); if(!el)return; sparks.push(new Chart(el,{type:"line",data:{labels:[0,1,2,3,4,5,6],datasets:[{data:[0,0,0,0,0,0,0],borderColor:k.grad[0]+"66",borderWidth:2,tension:.4,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false,min:0,max:1}}}})); });
      $("cartTotalSub").textContent="Total: $0 · sin datos";
      $("donutLegend").innerHTML = estados.map(e=>`<div class="li"><span class="dot" style="background:${e.c}"></span><span>${e.k}</span><span class="amt">$0</span><small>${e.s} · 0%</small></div>`).join("");
      donut=new Chart($("donut"),{type:"doughnut",data:{labels:["Sin datos"],datasets:[{data:[1],backgroundColor:["rgba(255,255,255,.08)"],borderWidth:0,cutout:"72%"}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}}}});
      $("cobranza").innerHTML = rutas.map(t=>`<div class="rowitem"><div><div class="t">${t}</div><div class="s">Sin asignar</div></div><div class="m">0%</div><div class="bar"><i style="width:0%"></i></div></div>`).join("");
      $("cajas").innerHTML = gerentes.map(n=>`<div class="caja"><div><div class="nm">${n}</div><div class="sub">Sin movimientos</div></div><div class="mv">$0</div><span class="st wait">Sin datos</span></div>`).join("");
      drawTrend("sem");
      $("scope").addEventListener("change", reveal);
      document.querySelectorAll("#period button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("#period button").forEach(x=>x.classList.remove("on"));b.classList.add("on");reveal();drawTrend(b.dataset.p);}));
    }
  };
  function drawTrend(period){
    const labs=labelsBy[period];
    $("trendSub").textContent= period==="sem"?"Sin movimientos esta semana":period==="mes"?"Sin movimientos este mes":"Sin movimientos este año";
    const data={labels:labs,datasets:[{label:"Recaudo",data:labs.map(()=>0),borderColor:C.teal,borderWidth:2.5,tension:.4,pointRadius:0},{label:"Colocación",data:labs.map(()=>0),borderColor:C.violet,borderWidth:2.5,tension:.4,pointRadius:0}]};
    const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:C.ink2,usePointStyle:true,pointStyleWidth:8,boxHeight:6}},tooltip:{enabled:false}},scales:{x:{grid:{color:C.grid},ticks:{color:C.ink2}},y:{grid:{color:C.grid},ticks:{color:C.ink2,callback:v=>pesoK(v)},suggestedMin:0,suggestedMax:1000}}};
    if(trend){trend.data=data;trend.options=opts;trend.update();} else trend=new Chart($("trend"),{type:"line",data,options:opts});
  }

  // ================= Vista: Clientes =================
  const clientes = { html(){ return `<div class="wrap">
    ${head("Clientes","Un expediente por cliente: datos, contacto, documentos, referencias y garantías. Busca antes de crear para evitar duplicados.",'<button class="btn-ghost btn" disabled>Importar</button><button class="btn" disabled>+ Nuevo cliente</button>')}
    <div class="toolbar"><input class="input search-in" placeholder="Buscar por nombre, documento o código…" disabled>
      <div class="field"><label>Oficina</label><select class="glass" disabled><option>Todas</option></select></div>
      <div class="field"><label>Ruta</label><select class="glass" disabled><option>Todas</option></select></div>
      <div class="field"><label>Zona</label><select class="glass" disabled><option>Todas</option></select></div>
    </div>
    <div class="card panel"><div class="ph"><h3 class="sec-title">Listado de clientes</h3><span class="chip2">0 registros</span></div>
      <div class="tablewrap"><table class="tbl"><thead><tr><th>Código</th><th>Documento</th><th>Nombre</th><th>Oficina / Ruta</th><th>Zona</th><th>Créditos</th><th>Estado</th></tr></thead>
      <tbody><tr><td colspan="7" style="border:0">${emptyState(ICO.users,"Aún no hay clientes","Importa la cartera del sistema actual o registra el primer cliente para comenzar.")}</td></tr></tbody></table></div></div>
    <div class="card panel"><h3 class="sec-title">La ficha del cliente tendrá estas secciones</h3>
      <div class="chips"><span class="chip2">Datos personales</span><span class="chip2">Contacto y domicilio</span><span class="chip2">Actividad económica</span><span class="chip2">Información financiera</span><span class="chip2">Referencias</span><span class="chip2">Documentos y evidencias</span><span class="chip2">Garantías</span><span class="chip2">Avales / codeudores</span></div>
    </div></div>`; } };

  // ================= Vista: Solicitudes =================
  const solicitudes = { html(){ const cols=[["Borrador","Capturada por el asesor"],["En revisión","Mesa de control revisa documentos"],["Observada","Regresa al asesor para corregir"],["Aprobada","Lista para desembolsar"],["Rechazada","Con motivo y bitácora"]];
    return `<div class="wrap">
    ${head("Solicitudes","Cada crédito registrado pasa a mesa de control dentro del mismo sistema. Revisión humana que aprueba, rechaza o devuelve.","")}
    <div class="note-card"><b>Mesa de control integrada.</b> Reemplaza el sistema externo que hoy usas para validar documentos. Todo queda en una sola plataforma.</div>
    <div class="pipe">${cols.map(c=>`<div class="card col"><div class="ch"><h4>${c[0]}</h4><span class="cnt">0</span></div><div class="ph">${c[1]}</div></div>`).join("")}</div>
    </div>`; } };

  // ================= Vista: Créditos =================
  const creditos = { html(){ return `<div class="wrap">
    ${head("Créditos","Cartera de créditos con condiciones versionadas, calendario de pagos y entrega con evidencia.",'<button class="btn-ghost btn" disabled>Exportar</button>')}
    <div class="statrow"><div class="card"><div class="lab">Créditos activos</div><div class="val">0</div></div><div class="card"><div class="lab">Colocado (mes)</div><div class="val">$0</div></div><div class="card"><div class="lab">Saldo total</div><div class="val">$0</div></div><div class="card"><div class="lab">Por vencer hoy</div><div class="val">0</div></div></div>
    <div class="card panel"><div class="ph"><h3 class="sec-title">Cartera</h3><span class="chip2">0 créditos</span></div>
      <div class="tablewrap"><table class="tbl"><thead><tr><th>Crédito</th><th>Cliente</th><th>Monto</th><th>Saldo</th><th>Cuota</th><th>Modalidad</th><th>Forma de pago</th><th>Estado</th></tr></thead>
      <tbody><tr><td colspan="8" style="border:0">${emptyState(ICO.card,"Sin créditos","Los créditos aparecerán al aprobar solicitudes o al importar la cartera.")}</td></tr></tbody></table></div></div>
    <div class="card panel"><h3 class="sec-title">Reglas por definir con el cliente</h3>
      <div class="chips"><span class="chip2">Cálculo de interés <span class="pend">por definir</span></span><span class="chip2">Plazo estándar <span class="pend">¿10 cuotas?</span></span><span class="chip2">Mora / penalización <span class="pend">por definir</span></span><span class="chip2">Días no laborables <span class="pend">por definir</span></span><span class="chip2">Liquidación anticipada <span class="pend">por definir</span></span></div></div>
    </div>`; } };

  // ================= Vista: Cobranza =================
  const cobranza = { html(){ return `<div class="wrap">
    ${head("Cobranza","Ruta del día, registro de pago en efectivo, recibo e historial. Un pago es una sola operación, sin duplicados.",'<button class="btn-ghost btn" disabled>Planilla recaudador</button>')}
    <div class="statrow"><div class="card"><div class="lab">Por cobrar hoy</div><div class="val">$0</div></div><div class="card"><div class="lab">Cobrado hoy</div><div class="val">$0</div></div><div class="card"><div class="lab">Clientes en ruta</div><div class="val">0</div></div><div class="card"><div class="lab">Cumplimiento</div><div class="val">0%</div></div></div>
    <div class="card panel"><div class="ph"><h3 class="sec-title">Agenda del día</h3></div>
      ${emptyState(ICO.cash,"No hay cobros programados","Al importar la cartera, aquí aparece la ruta de cobro del día por asesor.")}</div>
    </div>`; } };

  // ================= Vista: Cajas =================
  const cajas = { html(){ return `<div class="wrap">
    ${head("Cajas","El cambio más delicado: la cobranza del día pasa de la caja del asesor a la del gerente, automáticamente, con bitácora.","")}
    <div class="card panel"><h3 class="sec-title">Flujo del efectivo</h3>
      <div class="flowcard">
        <div class="flownode"><b>Asesor cobra en ruta</b><span>entra a su caja</span></div>
        <div class="flowarrow">→</div>
        <div class="flownode"><b>Cierre 18:00</b><span>traslado automático</span></div>
        <div class="flowarrow">→</div>
        <div class="flownode"><b>Caja del gerente</b><span>recibe y resguarda</span></div>
        <div class="flowarrow">→</div>
        <div class="flownode"><b>Redistribución</b><span>reparte para colocar</span></div>
      </div>
      <div class="note-card"><b>Regla:</b> la suma de las cajas no cambia con un traslado, y un cierre que se ejecute dos veces genera un solo traslado. Toda diferencia queda visible y se investiga.</div>
    </div>
    <div class="grid3">${gerentes.map(n=>`<div class="card panel"><div class="ph"><div><h3 class="sec-title">${n}</h3><div class="sub">Caja consolidada</div></div><span class="st wait">18:00</span></div>
      <div class="kv"><div class="r"><span class="k">Saldo inicial</span><span class="v">$0</span></div><div class="r"><span class="k">Ingresos del día</span><span class="v">$0</span></div><div class="r"><span class="k">Recibido de asesores</span><span class="v">$0</span></div><div class="r"><span class="k">Saldo en caja</span><span class="v">$0</span></div></div></div>`).join("")}</div>
    </div>`; } };

  // ================= Vista: Reportes =================
  const reportes = { html(){ const grupos=[["Recaudador","Cuadre y planilla por recaudador"],["Caja","Cuadre, saldos y balance"],["Créditos","Cartera, solicitudes y facturación"],["Auditoría","Anulados, traslados y visitas"],["Operación","Utilidad, balance y estadística"]];
    return `<div class="wrap">
    ${head("Reportes","Un solo reporte con selector de alcance: ruta, oficina, gerencia, zona o empresa. Exporta a Excel o PDF respetando tu ámbito.","")}
    <div class="grid-rep">${grupos.map(g=>`<div class="card rep-card"><h4>${g[0]}</h4><div class="rl">${g[1]}</div>
      <div class="field"><label>Alcance</label><select class="glass" disabled><option>Empresa</option><option>Zona</option><option>Gerencia</option><option>Oficina</option><option>Ruta</option></select></div>
      <div class="toolbar"><button class="btn-ghost btn" disabled>PDF</button><button class="btn" disabled>Excel</button></div></div>`).join("")}</div>
    <div class="note-card">Los botones se activan cuando haya datos. Hoy todo está en ceros.</div>
    </div>`; } };

  // ================= Vista: Importar datos =================
  const importar = { html(){ return `<div class="wrap">
    ${head("Importar datos","Trae la cartera del sistema actual (Listo) mediante Excel o CSV. Se hace una carga de prueba y luego la final.","")}
    <div class="steps">
      <div class="step active"><div class="num">1</div><div><div class="st">Subir archivo</div><small>Excel o CSV exportado</small></div></div>
      <div class="step"><div class="num">2</div><div><div class="st">Mapear columnas</div><small>Emparejar con el sistema</small></div></div>
      <div class="step"><div class="num">3</div><div><div class="st">Validar</div><small>Duplicados y faltantes</small></div></div>
      <div class="step"><div class="num">4</div><div><div class="st">Confirmar</div><small>Prueba o carga final</small></div></div>
    </div>
    <div class="card panel"><div class="drop"><div class="dico"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg></div>
      <b style="color:var(--ink);font-family:var(--font-d)">Arrastra tu archivo aquí</b>
      <span>Formatos: .xlsx, .xls, .csv — clientes, créditos, pagos y movimientos</span>
      <button class="btn" disabled>Seleccionar archivo</button></div></div>
    <div class="card panel"><h3 class="sec-title">Qué se importará</h3>
      <div class="tablewrap"><table class="tbl"><thead><tr><th>Entidad</th><th>Columna del archivo</th><th>Campo del sistema</th><th>Registros</th><th>Estado</th></tr></thead>
      <tbody><tr><td colspan="5" style="border:0">${emptyState(ICO.up,"Aún no hay archivo","Sube un Excel o CSV para ver el mapeo de columnas y la validación antes de cargar.")}</td></tr></tbody></table></div>
      <div class="note-card">Referencia de volumen del sistema actual: hasta 5,000 clientes, 5,000 créditos y 50,000 movimientos. Primero una carga de prueba para conciliar; luego la final.</div></div>
    </div>`; } };

  // ================= Vista: Administración =================
  const admin = { html(){ return `<div class="wrap">
    ${head("Administración","Estructura, usuarios y roles, parámetros y bitácora. Las acciones sensibles quedan registradas.","")}
    <div class="tabs2" id="adminTabs"><button data-t="usuarios" class="on">Usuarios y roles</button><button data-t="estructura">Estructura</button><button data-t="parametros">Parámetros</button><button data-t="bitacora">Bitácora</button></div>
    <div id="adminBody"></div></div>`; },
    init(){
      const roles=[["Dirección","Ve todo; autoriza acciones financieras"],["Regional","Su región: gerencias, oficinas y rutas"],["Gerente","Sus oficinas; recibe y redistribuye caja"],["Asesor / cobrador","Su ruta: clientes, cobro y caja propia"],["Mesa de control","Revisa documentos; aprueba o rechaza"],["Consulta / auditoría","Sólo lectura en su ámbito"]];
      const body=$("adminBody");
      const parts={
        usuarios(){ return `<div class="card panel"><div class="ph"><h3 class="sec-title">Roles del sistema</h3><span class="chip2">por ámbito: región → gerencia → oficina → ruta</span></div>
          ${roles.map(r=>`<div class="rolerow"><div><div class="rn">${r[0]}</div><div class="rd">${r[1]}</div></div><div class="cap">Permisos en servidor y API</div></div>`).join("")}
          <div class="note-card" style="margin-top:4px"><b>Cuenta de soporte NXUS.</b> Acceso del proveedor para mantenimiento. No aparece en la operación diaria de los empleados, pero es visible para el dueño y sus acciones quedan en la bitácora. El dueño la puede revocar.</div>
          </div>
          <div class="card panel"><div class="ph"><h3 class="sec-title">Usuarios</h3><button class="btn" disabled>+ Nuevo usuario</button></div>
          ${emptyState(ICO.users,"Sin usuarios cargados","Crea los usuarios o impórtalos del sistema actual. Cada uno recibe un rol y un ámbito.")}</div>`; },
        estructura(){ return `<div class="card panel"><div class="ph"><h3 class="sec-title">Jerarquía</h3><button class="btn" disabled>+ Agregar nivel</button></div>
          <div class="tree">
            <div class="tn">Empresa</div>
            <div class="tn lvl2 mut">Región <span class="pend">por definir</span></div>
            <div class="tn lvl3 mut">Gerencia <span class="pend">por definir</span></div>
            <div class="tn lvl4 mut">Oficina → Ruta</div>
          </div>
          <div class="note-card">En el sistema actual sólo existen Oficina y Ruta; Región y Gerencia se agregan aquí. Hay que definir qué niveles son obligatorios.</div></div>`; },
        parametros(){ const kv=[["Productos de préstamo","0 configurados"],["Hora de cierre de caja","18:00 (configurable)"],["Interés y base de días","por definir"],["Mora / penalización","por definir"],["Días no laborables","por definir"],["Documentos obligatorios","por definir"],["MFA de administradores","activado"],["Respaldos","diarios · 30 días"]];
          return `<div class="card panel"><h3 class="sec-title">Parámetros</h3><div class="kv">${kv.map(r=>`<div class="r"><span class="k">${r[0]}</span><span class="v">${/definir/.test(r[1])?'<span class="pend">'+r[1]+'</span>':r[1]}</span></div>`).join("")}</div></div>`; },
        bitacora(){ return `<div class="card panel"><div class="ph"><h3 class="sec-title">Bitácora</h3><span class="chip2">0 eventos</span></div>
          ${emptyState(ICO.file,"Sin eventos todavía","Cada alta, cambio, pago, reverso o cierre quedará aquí: quién, cuándo, qué y por qué.")}</div>`; }
      };
      function paint(t){ body.innerHTML = parts[t](); }
      paint("usuarios");
      $("adminTabs").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{$("adminTabs").querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");paint(b.dataset.t);}));
    }
  };

  // ================= Router =================
  const VIEWS = { tablero, clientes, solicitudes, creditos, cobranza, cajas, reportes, importar, admin };
  function go(key){ destroyCharts(); const v=VIEWS[key]||tablero; $("view").innerHTML=v.html(); if(v.init)v.init(); $("view").parentElement.scrollTop=0; }

  const app=document.querySelector(".app");
  function reveal(){ if(reduceMotion)return; app.classList.add("reveal"); clearTimeout(reveal._t); reveal._t=setTimeout(()=>app.classList.remove("reveal"),210); }

  const side=$("side"), scrim=$("scrim");
  $("menuBtn").addEventListener("click",()=>{side.classList.add("open");scrim.classList.add("on");});
  scrim.addEventListener("click",()=>{side.classList.remove("open");scrim.classList.remove("on");});
  document.querySelectorAll(".nav a").forEach(a=>a.addEventListener("click",()=>{
    document.querySelectorAll(".nav a").forEach(x=>x.classList.remove("on")); a.classList.add("on");
    side.classList.remove("open"); scrim.classList.remove("on"); reveal(); go(a.dataset.view);
  }));

  Chart.defaults.font.family="Inter, system-ui, sans-serif"; Chart.defaults.color=C.ink2;
  go("tablero");
})();
</script>
