<title>Mapa Crédito y Cobranza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-height workspace — header strip, pannable SVG map, ficha panel at right (bottom sheet on phone). Colors follow the NXUS guide: navy + teal. */
:root {
  --bg: #f3f6f7;
  --surface: #ffffff;
  --surface-2: #e9f1f2;
  --ink: #142739;
  --ink-2: #4a5d6c;
  --line: #c9d6db;
  --line-soft: #dde6e9;
  --teal: #0e7c7b;
  --teal-soft: #d6ecec;
  --navy: #142739;
  --on-navy: #ffffff;
  --rust: #b04a2a;
  --rust-soft: #f6e3dc;
  --ochre: #8a6512;
  --ochre-soft: #f4ead2;
  --slate: #3c5a8a;
  --slate-soft: #e0e7f3;
  --focus: #0e7c7b;
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a24; --surface: #142430; --surface-2: #1a3040; --ink: #e4edf1; --ink-2: #9fb2bd;
    --line: #2f4757; --line-soft: #233746; --teal: #4cc3bf; --teal-soft: #173c42; --navy: #e4edf1; --on-navy: #0e1a24;
    --rust: #f08c69; --rust-soft: #3b2219; --ochre: #e0b65a; --ochre-soft: #352b14; --slate: #94b1e3; --slate-soft: #1d2b42;
    --focus: #4cc3bf; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a24; --surface: #142430; --surface-2: #1a3040; --ink: #e4edf1; --ink-2: #9fb2bd;
  --line: #2f4757; --line-soft: #233746; --teal: #4cc3bf; --teal-soft: #173c42; --navy: #e4edf1; --on-navy: #0e1a24;
  --rust: #f08c69; --rust-soft: #3b2219; --ochre: #e0b65a; --ochre-soft: #352b14; --slate: #94b1e3; --slate-soft: #1d2b42;
  --focus: #4cc3bf; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; overflow: hidden; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { min-width: 0; flex: 1 1 320px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); font-weight: 600; }
.brand h1 { margin: 2px 0 0; font-size: 19px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.brand .meta { color: var(--ink-2); font-size: 12.5px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { position: relative; }
.search input {
  width: 210px; max-width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
}
.btn {
  height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500;
}
.btn:hover { border-color: var(--teal); }
.btn[aria-pressed="true"] { background: var(--teal-soft); border-color: var(--teal); color: var(--ink); }
.results {
  position: absolute; top: 38px; left: 0; z-index: 30; width: 280px; max-width: 80vw; max-height: 300px; overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px;
}
.results button { display: flex; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 5px; cursor: pointer; }
.results button:hover, .results button.on { background: var(--surface-2); }
.results .rid { font-family: var(--font-mono); font-size: 12px; color: var(--teal); min-width: 40px; }

.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; }
.stage svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; -webkit-user-select: none; }
.stage svg.panning { cursor: grabbing; }
.zoom {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; flex-direction: column; gap: 6px;
}
.zoom .btn { width: 36px; padding: 0; justify-content: center; font-size: 17px; }
.zoom .btn.wide { width: auto; padding: 0 10px; font-size: 12.5px; }
.hint {
  position: absolute; right: 12px; bottom: 12px; font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line-soft);
  padding: 6px 10px; border-radius: 6px; max-width: 60%;
}

/* SVG */
.edge-nav { stroke: var(--line); stroke-width: 1.6; fill: none; }
.edge-entry { stroke: var(--ink-2); stroke-width: 1.8; fill: none; }
.edge-seq { stroke: var(--teal); stroke-width: 1.8; fill: none; }
.edge-data { stroke: var(--slate); stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
.edge-dim { opacity: .28; }
.edge-label { font-family: var(--font-sans); font-size: 11.5px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.edge-label.seq { fill: var(--teal); }
.edge-label.data { fill: var(--slate); }
.edge-label.entry { fill: var(--ink-2); }
.node { cursor: pointer; }
.node circle.body { stroke-width: 2; }
.node.center circle.body { fill: var(--navy); stroke: var(--navy); }
.node.module circle.body { fill: var(--surface-2); stroke: var(--teal); }
.node.sub circle.body { fill: var(--surface); stroke: var(--teal); stroke-width: 1.5; }
.node.entry circle.body { fill: var(--surface); stroke: var(--ink-2); }
.node.pending circle.body { stroke: var(--rust); stroke-dasharray: 4 4; }
.node .sel { fill: none; stroke: var(--teal); stroke-width: 3; opacity: 0; }
.node.selected .sel { opacity: 1; }
.node:hover circle.body { filter: brightness(1.04); stroke-width: 2.6; }
.node:focus { outline: none; }
.node:focus-visible .sel { opacity: 1; stroke: var(--focus); stroke-dasharray: 3 3; }
.n-id { font-family: var(--font-mono); font-weight: 600; fill: var(--teal); }
.n-title { font-family: var(--font-sans); font-weight: 600; fill: var(--ink); }
.n-sub { font-family: var(--font-sans); fill: var(--ink-2); }
.center .n-id, .center .n-title, .center .n-sub { fill: var(--on-navy); }
.badge-d circle { fill: var(--rust-soft); stroke: var(--rust); stroke-width: 1.2; }
.badge-d text { font-family: var(--font-mono); font-size: 10px; font-weight: 600; fill: var(--rust); }
.badge-x circle { fill: var(--teal); }
.badge-x text { font-family: var(--font-mono); font-size: 12px; font-weight: 600; fill: var(--surface); }

/* Panel */
.panel { min-height: 0; overflow: auto; border-left: 1px solid var(--line); background: var(--surface); }
.panel-inner { padding: 18px 20px 28px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.handle { display: none; }
.f-head { display: grid; gap: 6px; }
.f-id { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--teal); letter-spacing: .03em; }
.f-head h2 { margin: 0; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.f-fn { color: var(--ink); margin: 0; }
.f-crumb { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.f-crumb button { border: 0; background: none; padding: 0; color: var(--teal); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.f-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.fields { display: grid; gap: 0; border-top: 1px solid var(--line-soft); }
.field { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.field dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 600; padding-top: 2px; }
.field dd { margin: 0; min-width: 0; }
.field ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.field li { display: flex; gap: 6px; align-items: baseline; }
.missing { color: var(--ink-2); font-style: italic; border: 1px dashed var(--line); border-radius: 5px; padding: 2px 8px; display: inline-block; font-size: 12.5px; }
.tag {
  flex: none; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; line-height: 1; padding: 3px 5px; border-radius: 4px; border: 1px solid transparent;
  position: relative; top: -1px;
}
.tag.R { background: var(--slate-soft); color: var(--slate); }
.tag.F { background: var(--teal-soft); color: var(--teal); }
.tag.P { background: var(--ochre-soft); color: var(--ochre); }
.tag.D { background: var(--rust-soft); color: var(--rust); border: 1px dashed var(--rust); }
.tag.Q { background: transparent; color: var(--ink-2); border: 1px dashed var(--ink-2); }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px 3px 8px; cursor: pointer; font-size: 12.5px;
  display: inline-flex; gap: 6px; align-items: baseline;
}
.chip:hover { border-color: var(--teal); }
.chip .cid { font-family: var(--font-mono); font-size: 11px; color: var(--teal); font-weight: 600; }
.conn { display: grid; gap: 5px; }
.conn button { text-align: left; border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); }
.conn button:hover .cid { text-decoration: underline; }
.conn .cid { font-family: var(--font-mono); font-size: 12px; color: var(--teal); font-weight: 600; }
.conn .kind { font-size: 11px; color: var(--ink-2); }

.intro h2 { margin: 0; font-size: 20px; line-height: 1.25; text-wrap: balance; }
.intro p { margin: 0; }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; background: var(--bg); }
.box h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); }
.legend { display: grid; gap: 8px; }
.legend-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13px; }
.legend-row svg { width: 52px; height: 22px; overflow: visible; }
.tags-legend { display: grid; gap: 6px; font-size: 13px; }
.tags-legend div { display: flex; gap: 8px; align-items: baseline; }
.prio { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.prio b { font-weight: 600; }
.mods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.mods .chip { border-radius: 6px; justify-content: flex-start; }
.small { font-size: 12.5px; color: var(--ink-2); }

@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); position: relative; }
  .panel {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 62%; border-left: 0; border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0; box-shadow: 0 -8px 28px rgba(0,0,0,.16); transition: transform .25s ease; z-index: 20;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .panel[data-open="false"] { transform: translateY(calc(100% - 52px)); overflow: hidden; }
  .handle {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; height: 52px; border: 0; background: var(--surface);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    position: sticky; top: 0; z-index: 2; border-bottom: 1px solid var(--line-soft); cursor: pointer; font-weight: 600; text-align: left;
  }
  .handle .grip { width: 36px; height: 4px; border-radius: 4px; background: var(--line); flex: none; }
  .handle .ht { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .handle .hs { font-size: 12px; color: var(--ink-2); font-weight: 500; flex: none; }
  .panel-inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .zoom { bottom: 64px; }
  .hint { display: none; }
  .top { padding-block: 10px; gap: 8px; }
  .brand { flex-basis: 100%; }
  .brand .meta { display: none; }
  .tools { width: 100%; flex-wrap: nowrap; gap: 6px; }
  .search { flex: 1 1 auto; min-width: 0; }
  .search input { width: 100%; }
  .tools .btn { padding: 0 9px; font-size: 12.5px; }
  #collapseAll { display: none; }
  .panel { max-height: 56%; }
  .brand h1 { font-size: 17px; }
  .field { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">NXUS AI · Financiera de Emmanuel Copto</div>
      <h1>Mapa del sistema de crédito y cobranza</h1>
      <div class="meta">Vista general · mapa v0.1 · basado en la guía v1.0 del 4 nov 2026</div>
    </div>
    <div class="tools">
      <div class="search">
        <label for="q" class="sr" hidden>Buscar círculo</label>
        <input id="q" type="search" placeholder="Buscar ID o nombre…" autocomplete="off" aria-label="Buscar círculo por ID o nombre">
        <div class="results" id="results" hidden></div>
      </div>
      <button class="btn" id="expandAll" type="button">Desplegar todo</button>
      <button class="btn" id="collapseAll" type="button">Contraer</button>
      <button class="btn" id="allLinks" type="button" aria-pressed="false">Todas las conexiones</button>
    </div>
  </header>
  <div class="main">
    <div class="stage" id="stage">
      <svg id="svg" role="application" aria-label="Mapa de círculos conectados. Arrastra para mover, usa la rueda o pellizca para acercar.">
        <defs>
          <marker id="arSeq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--teal)"/></marker>
          <marker id="arData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--slate)"/></marker>
          <marker id="arEntry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-2)"/></marker>
        </defs>
        <g id="world"><g id="edges"></g><g id="labels"></g><g id="nodes"></g></g>
      </svg>
      <div class="zoom">
        <button class="btn" id="zin" type="button" aria-label="Acercar">+</button>
        <button class="btn" id="zout" type="button" aria-label="Alejar">−</button>
        <button class="btn wide" id="fit" type="button">Encuadrar</button>
        <button class="btn wide" id="reset" type="button">Reordenar</button>
      </div>
      <div class="hint">Toca un módulo para desplegar sus círculos. Arrastra un círculo para moverlo.</div>
    </div>
    <aside class="panel" id="panel" data-open="false" aria-live="polite">
      <button class="handle" id="handle" type="button" aria-controls="panel"><span class="grip"></span><span class="ht" id="handleTitle">Cómo leer el mapa</span><span class="hs" id="handleState">Abrir</span></button>
      <div class="panel-inner" id="panelInner"></div>
    </aside>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Datos: cada valor lleva su etiqueta de origen [R] [F] [P] [D]; [?] = pregunta sugerida por Claude, no está en la guía ----------

    { id: "N100", t: "Tablero", s: "Resumen", a: -90 },

    { id: "N300", t: "Solicitudes", s: "Revisión", a: 0 },

    { id: "N700", t: "Reportes", s: "Análisis", a: 180 },
    { id: "N800", t: "Administración", s: "Control", a: -135 }
  ];

  const N = {

      fn: "Autentica al usuario, recupera el acceso cuando corresponde y comprueba que la cuenta esté activa.",

      pend: ["[R] Fórmulas y pantallas actuales por verificar", "[D] Definición de cada indicador (ver círculos N110 a N130)", "[D] No usar la cantidad de personas como sustituto del dinero adeudado"] },

      if (extra) extra.forEach(line => { y += 14; const ts = el("text", { y: y - 1, "text-anchor": "middle", class: "n-sub", "font-size": 11.5 }, g); ts.textContent = line; });

        el("circle", { r: 10 }, bg);
        const bt = el("text", { y: 3.5, "text-anchor": "middle" }, bg); bt.textContent = "D";
      }
      if (n.kind === "module") {
        const a = Math.PI / 4, bx = Math.cos(a) * r, by = Math.sin(a) * r;
        const bg = el("g", { class: "badge-x", transform: `translate(${bx},${by})` }, g);
        el("circle", { r: 11 }, bg);
        const bt = el("text", { y: 4, "text-anchor": "middle" }, bg); bt.textContent = state.expanded.has(id) ? "−" : "+";
        const sc = SUBS[id].some(s => N[s].pending);
        if (sc) {
          const a2 = -Math.PI / 4, cx2 = Math.cos(a2) * r, cy2 = Math.sin(a2) * r;
          const dg = el("g", { class: "badge-d", transform: `translate(${cx2},${cy2})` }, g);

  // ---------- Vista: pan / zoom ----------
  function applyView() { const v = state.view; world.setAttribute("transform", `translate(${v.x},${v.y}) scale(${v.k})`); }

  const TAG_TITLE = { R: "Reunión del 29 oct 2026", F: "Especificación funcional", P: "Propuesta de diseño, por validar", D: "Por definir", Q: "Pregunta sugerida por Claude; no está en la guía" };
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function introHTML() {

    return `
      <div class="intro" style="display:grid;gap:14px">

          <div class="legend">
            <div class="legend-row"><svg viewBox="0 0 52 22"><line x1="2" y1="11" x2="50" y2="11" class="edge-nav"/></svg><span>Navegación: acceso desde Inicio o desde el módulo</span></div>
            <div class="legend-row"><svg viewBox="0 0 52 22"><line x1="2" y1="11" x2="44" y2="11" class="edge-seq" marker-end="url(#arSeq)"/></svg><span>Secuencia de negocio, con verbo: «aprueba», «registra», «transfiere»</span></div>
            <div class="legend-row"><svg viewBox="0 0 52 22"><line x1="2" y1="11" x2="44" y2="11" class="edge-data" marker-end="url(#arData)"/></svg><span>Dependencia de datos o consulta</span></div>
            <div class="legend-row"><svg viewBox="0 0 52 22"><circle cx="26" cy="11" r="9" fill="none" stroke="var(--rust)" stroke-width="2" stroke-dasharray="4 4"/><text x="26" y="15" text-anchor="middle" font-size="10" font-family="var(--font-mono)" font-weight="600" fill="var(--rust)">D</text></svg><span>Contorno punteado: depende de decisiones prioritarias pendientes (${pendCount} círculos)</span></div>
          </div>
          <p class="small" style="margin:0">Por defecto se dibujan las conexiones del círculo elegido y de los módulos desplegados. «Todas las conexiones» las muestra todas.</p>
        </div>
        <div class="box">
          <h3>Etiquetas de origen</h3>
          <div class="tags-legend">
            <div>${tagHTML("R")}<span>Reunión del 29 oct 2026</span></div>
            <div>${tagHTML("F")}<span>Especificación funcional, consolidada el 30 oct 2026</span></div>
            <div>${tagHTML("P")}<span>Propuesta de diseño; Eduardo y el cliente la validan</span></div>
            <div>${tagHTML("D")}<span>Por definir; se pregunta y se documenta la respuesta</span></div>
            <div>${tagHTML("?")}<span>Pregunta que sugiero agregar; no está en la guía</span></div>
          </div>
        </div>
        <div class="box">
          <h3>Decisiones que bloquean primero</h3>
          <ol class="prio">
            <li><b>Dinero.</b> Los dos productos, tasa, periodicidad, base de días, mora, orden de aplicación y redondeo, con ejemplos de pago parcial, atraso y liquidación.</li>
            <li><b>Cajas.</b> Si se traslada todo el saldo o sólo lo cobrado, a qué hora y zona horaria, a qué gerente, y cómo se recibe y se resuelven faltantes.</li>
            <li><b>Datos actuales.</b> Qué archivos se pueden exportar, si traen IDs, cuotas, pagos y saldos, cuántos registros hay y la fecha de corte.</li>
          </ol>
        </div>
        <p class="small">Fuera de la versión inicial: IA operativa, telefonía, pasarela y conciliación bancaria, dispersión de préstamos, app nativa, CFDI, Buró de Crédito, PLD/KYC automatizado, OCR y firma electrónica.</p>
      </div>`;
  }

  // ---------- Barra superior ----------
  const q = document.getElementById("q"), results = document.getElementById("results");
  let hits = [], hi = 0;
  function norm(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function runSearch() {
    const s = norm(q.value.trim());
    if (!s) { results.hidden = true; return; }
    hits = Object.keys(N).filter(id => norm(id).includes(s) || norm(N[id].t).includes(s) || norm(N[id].fn || "").includes(s)).slice(0, 12);
    hi = 0;
    if (!hits.length) { results.innerHTML = `<div class="small" style="padding:8px">Sin coincidencias</div>`; results.hidden = false; return; }
    results.innerHTML = hits.map((id, i) => `<button type="button" data-hit="${id}" class="${i === hi ? "on" : ""}"><span class="rid">${id}</span><span>${esc(N[id].t)}</span></button>`).join("");
    results.hidden = false;
    results.querySelectorAll("[data-hit]").forEach(b => b.addEventListener("click", () => pick(b.getAttribute("data-hit"))));
  }
  function pick(id) { results.hidden = true; q.value = ""; select(id, true); }
  q.addEventListener("input", runSearch);
  q.addEventListener("keydown", e => {
    if (results.hidden || !hits.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); hi = (hi + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length;
      results.querySelectorAll("[data-hit]").forEach((b, i) => b.classList.toggle("on", i === hi));
    } else if (e.key === "Enter") { e.preventDefault(); pick(hits[hi]); }
    else if (e.key === "Escape") { results.hidden = true; }
  });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) results.hidden = true; });

  document.getElementById("expandAll").addEventListener("click", () => { MODULES.forEach(m => state.expanded.add(m.id)); render(); renderPanel(); fitAll(true); });
  document.getElementById("collapseAll").addEventListener("click", () => {
    state.expanded.clear();
    if (state.selected && N[state.selected].kind === "sub") state.selected = N[state.selected].parent;
    render(); renderPanel(); setHash(state.selected); fitAll(true);
  });
  const allBtn = document.getElementById("allLinks");
  allBtn.addEventListener("click", () => { state.allLinks = !state.allLinks; allBtn.setAttribute("aria-pressed", String(state.allLinks)); render(); });
  document.getElementById("zin").addEventListener("click", () => { const { w, h } = stageBox(); zoomAt(1.25, w / 2, h / 2); });
  document.getElementById("zout").addEventListener("click", () => { const { w, h } = stageBox(); zoomAt(0.8, w / 2, h / 2); });
  document.getElementById("fit").addEventListener("click", () => fitAll(true));
  document.getElementById("reset").addEventListener("click", () => { state.offset = {}; render(); fitAll(true); });

  // ---------- Arranque ----------
  function fromHash() {
    const h = (location.hash || "").replace("#", "").toUpperCase();
    if (h && N[h]) { select(h, false); fitAll(false); centerOn(h); return true; }
    return false;
  }
  window.addEventListener("hashchange", () => { const h = location.hash.replace("#", "").toUpperCase(); if (N[h] && h !== state.selected) select(h, true); });
  let resizeT;
  window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => fitAll(false), 150); });

  openSheet(!isSheet());
  render();
  renderPanel();
  if (!fromHash()) requestAnimationFrame(() => fitAll(false));
})();
</script>
