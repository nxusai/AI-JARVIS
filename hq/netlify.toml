# NXUS HQ (app.nxusai.org) — ver docs/guia-hq.md
[build]
  publish = "public"
  functions = "netlify/functions"

# La IA ve los videos: ffmpeg saca los cuadros en el servidor (functions/analizar-background.mjs).
[functions."analizar-background"]
  external_node_modules = ["ffmpeg-static"]
  included_files = ["node_modules/ffmpeg-static/ffmpeg"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
