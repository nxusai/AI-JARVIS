[build]
  command = "npm run build"
  publish = "dist"

# Direcciones limpias: /jarvis sirve jarvis.html
[[redirects]]
  from = "/jarvis"
  to = "/jarvis.html"
  status = 200
[[redirects]]
  from = "/soluciones"
  to = "/soluciones.html"
  status = 200
[[redirects]]
  from = "/industrias"
  to = "/industrias.html"
  status = 200
[[redirects]]
  from = "/proceso"
  to = "/proceso.html"
  status = 200
[[redirects]]
  from = "/nosotros"
  to = "/nosotros.html"
  status = 200
[[redirects]]
  from = "/contacto"
  to = "/contacto.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
