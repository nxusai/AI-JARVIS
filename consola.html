<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#01060c" />
    <!--
      The console only ever talks to the local bridge. Nothing remote is loaded
      and nothing it shows — email bodies included — can reach a network host
      of a page author's choosing.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        img-src 'self' data:;
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' ws://localhost:* ws://127.0.0.1:* http://localhost:8787 http://127.0.0.1:8787;
      "
    />
    <title>Consola Nexy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/console/main.tsx"></script>
  </body>
</html>
